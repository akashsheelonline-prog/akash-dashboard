<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Akash Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .loginbox {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 15px 50px #0001;
    }

    .loginbox h1 {
      margin: 0 0 6px;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .loginbox input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d6dce6;
      border-radius: 8px;
      font: inherit;
    }

    /* BUTTONS */

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: white;
      border: 1px solid #dbe1ea;
      color: #172033;
    }

    .danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* APP */

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 245px;
      background: #101827;
      color: #fff;
      padding: 24px 16px;
      position: fixed;
      inset: 0 auto 0 0;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      padding: 0 10px 28px;
    }

    .brand span {
      font-weight: 400;
      color: #9ca9bd;
    }

    .nav button {
      width: 100%;
      background: none;
      border: 0;
      color: #cbd5e1;
      text-align: left;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      margin: 2px 0;
    }

    .nav button:hover,
    .nav button.active {
      background: #1f2b3d;
      color: #fff;
    }

    .logout {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
    }

    /* MAIN */

    .main {
      margin-left: 245px;
      flex: 1;
      padding: 28px;
      max-width: 1600px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .top h1 {
      margin: 0;
      font-size: 28px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      padding: 16px;
    }

    .card .n {
      font-size: 25px;
      font-weight: 800;
      margin-top: 7px;
    }

    /* PANEL */

    .panel {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .toolbar {
      padding: 15px;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e5e9f0;
    }

    .search {
      flex: 1;
      min-width: 220px;
    }

    .toolbar input,
    .toolbar select {
      padding: 10px;
      border: 1px solid #d6dce6;
      border-radius: 8px;
      background: #fff;
    }

    /* TABLE */

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    th,
    td {
      padding: 12px 13px;
      border-bottom: 1px solid #edf0f4;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
      color: #4b5563;
      font-size: 12px;
      text-transform: uppercase;
    }

    tr.selected td {
      background: #eff6ff;
    }

    .table-wrap {
      overflow: auto;
    }

    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .imp {
      background: #fee2e2;
      color: #991b1b;
    }

    .med {
      background: #fef3c7;
      color: #92400e;
    }

    .low {
      background: #e0e7ff;
      color: #3730a3;
    }

    .new {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .cancelled {
      background: #e5e7eb;
      color: #374151;
    }

    .due {
      background: #fef3c7;
      color: #92400e;
    }

    .overdue {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: #0008;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: min(680px, 100%);
      border-radius: 14px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    .field input,
    .field textarea,
    .field select {
      padding: 10px;
      border: 1px solid #d6dce6;
      border-radius: 8px;
      font: inherit;
      width: 100%;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    @media(max-width:1000px) {

      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .sidebar {
        width: 210px;
      }

      .main {
        margin-left: 210px;
      }

    }

    @media(max-width:700px) {

      .app {
        display: block;
      }

      .sidebar {
        position: static;
        width: 100%;
        min-height: auto;
      }

      .main {
        margin-left: 0;
        padding: 16px;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .form {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .logout {
        position: static;
        margin-top: 10px;
      }

    }

  </style>

</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login" class="login">

  <div class="loginbox">

    <h1>Akash Dashboard</h1>

    <p class="muted">
      Sign in to manage your tasks.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username">

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button
      id="loginBtn"
      class="btn primary"
      style="width:100%">
      Login
    </button>

    <p
      id="loginMsg"
      class="muted">
    </p>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="app" class="app hidden">

  <aside class="sidebar">

    <div class="brand">
      AKASH <span>DASHBOARD</span>
    </div>

    <nav class="nav">

      <button
        class="active"
        data-view="dashboard">
        ▣ Dashboard
      </button>

      <button data-view="all">
        ▤ All Tasks
      </button>

      <button data-view="new">
        ＋ New
      </button>
      

      <button data-view="due">
        ◷ Due Today
      </button>

      <button data-view="overdue">
        ⚠ Overdue
      </button>

      <button data-view="upcoming">
        ◫ Upcoming
      </button>

      <button data-view="completed">
        ✓ Completed
      </button>

      <button data-view="cancelled">
        ✕ Cancelled
      </button>

    </nav>

    <button
      id="logoutBtn"
      class="btn secondary logout">
      Logout
    </button>

  </aside>


  <main class="main">

    <div class="top">

      <div>

        <h1 id="pageTitle">
          Akash Dashboard
        </h1>

        <div
          class="muted"
          id="todayLabel">
        </div>

      </div>


      <div class="actions">

        <button
          class="btn secondary"
          id="editBtn"
          disabled>
          Edit
        </button>

        <button
          class="btn danger"
          id="removeBtn"
          disabled>
          Remove
        </button>

        <button
          class="btn success"
          id="completeBtn"
          disabled>
          ✓ Complete
        </button>

        <button
          class="btn warning"
          id="cancelBtn"
          disabled>
          ✕ Cancel
        </button>

        <button
          class="btn primary"
          id="createBtn">
          + Create
        </button>

      </div>

    </div>


    <!-- CARDS -->

    <section class="cards">

      <div class="card">
        <div class="muted">
          Total Tasks
        </div>

        <div
          class="n"
          id="cTotal">
          0
        </div>
      </div>


      <div class="card">
        <div class="muted">
          New
        </div>

        <div
          class="n"
          id="cNew">
          0
        </div>
      </div>


      <div class="card">
        <div class="muted">
          Due Today
        </div>

        <div
          class="n"
          id="cDue">
          0
        </div>
      </div>


      <div class="card">
        <div class="muted">
          Overdue
        </div>

        <div
          class="n"
          id="cOverdue">
          0
        </div>
      </div>


      <div class="card">
        <div class="muted">
          Completed
        </div>

        <div
          class="n"
          id="cCompleted">
          0
        </div>
      </div>


      <div class="card">
        <div class="muted">
          Cancelled
        </div>

        <div
          class="n"
          id="cCancelled">
          0
        </div>
      </div>

    </section>


    <!-- FILTERS -->

    <section class="panel">

      <div class="toolbar">

        <input
          class="search"
          id="search"
          placeholder="Search title or details...">

        <select id="typeFilter">

          <option value="">
            All Types
          </option>

          <option value="Important">
            Important
          </option>

          <option value="Medium">
            Medium
          </option>

          <option value="Low">
            Low
          </option>

        </select>


        <select id="relatedFilter">

          <option value="">
            All Related
          </option>

          <option value="Home">
            Home
          </option>

          <option value="Work">
            Work
          </option>

        </select>


        <select id="statusFilter">

          <option value="">
            All Status
          </option>

          <option value="New">
            New
          </option>

          <option value="Completed">
            Completed
          </option>

          <option value="Cancelled">
            Cancelled
          </option>

        </select>

      </div>


      <!-- TABLE -->

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                <input
                  type="checkbox"
                  id="selectAll">
              </th>

              <th>
                Date
              </th>

              <th>
                Title
              </th>

              <th>
                Details
              </th>

              <th>
                Type
              </th>

              <th>
                Related
              </th>

              <th>
                Due Date
              </th>

              <th>
                Status
              </th>

            </tr>

          </thead>

          <tbody id="tbody"></tbody>

        </table>

      </div>

    </section>

  </main>

</div>


<!-- =====================================================
     CREATE / EDIT MODAL
===================================================== -->

<div
  class="modal"
  id="modal">

  <div class="modal-box">

    <h2 id="modalTitle">
      Create New Task
    </h2>


    <form id="taskForm">

      <div class="form">


        <div class="field">

          <label>
            Date
          </label>

          <input
            id="date"
            type="date"
            readonly
            required>

        </div>


        <div class="field">

          <label>
            Title
          </label>

          <input
            id="title"
            type="text"
            required>

        </div>


        <div class="field full">

          <label>
            Details
          </label>

          <textarea
            id="details"></textarea>

        </div>


        <div class="field">

          <label>
            Type
          </label>

          <select id="type">

            <option value="Important">
              Important
            </option>

            <option
              value="Medium"
              selected>
              Medium
            </option>

            <option value="Low">
              Low
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Related
          </label>

          <select id="related">

            <option value="Home">
              Home
            </option>

            <option
              value="Work"
              selected>
              Work
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Due Date
          </label>

          <input
            id="dueDate"
            type="date"
            required>

        </div>


      </div>


      <div class="modal-actions">

        <!-- IMPORTANT: type=button -->
        <button
          type="button"
          class="btn secondary"
          id="closeModal">
          Cancel
        </button>


        <button
          class="btn primary"
          type="submit"
          id="saveBtn">
          Create Task
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

/*
   IMPORTANT:
   Keep the SAME Supabase URL and public/publishable key
   that you already had in your working code.

   NEVER put the service_role/secret key here.
*/

const SUPABASE_URL =
  "https://dadnspgmkymdrpzyvhch.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_tBHn0H5ThLff8mApenKTCw_pAfZAiwW";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let tasks = [];

let selected =
  new Set();

let view =
  "dashboard";

let editingId =
  null;


/* =====================================================
   ELEMENTS
===================================================== */

const login =
  document.getElementById("login");

const app =
  document.getElementById("app");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginMsg =
  document.getElementById("loginMsg");

const logoutBtn =
  document.getElementById("logoutBtn");

const createBtn =
  document.getElementById("createBtn");

const editBtn =
  document.getElementById("editBtn");

const removeBtn =
  document.getElementById("removeBtn");

const completeBtn =
  document.getElementById("completeBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const modal =
  document.getElementById("modal");

const closeModalBtn =
  document.getElementById("closeModal");

const taskForm =
  document.getElementById("taskForm");

const modalTitle =
  document.getElementById("modalTitle");

const saveBtn =
  document.getElementById("saveBtn");

const date =
  document.getElementById("date");

const title =
  document.getElementById("title");

const details =
  document.getElementById("details");

const type =
  document.getElementById("type");

const related =
  document.getElementById("related");

const dueDate =
  document.getElementById("dueDate");

const tbody =
  document.getElementById("tbody");

const selectAll =
  document.getElementById("selectAll");

const search =
  document.getElementById("search");

const typeFilter =
  document.getElementById("typeFilter");

const relatedFilter =
  document.getElementById("relatedFilter");

const statusFilter =
  document.getElementById("statusFilter");

const pageTitle =
  document.getElementById("pageTitle");

const todayLabel =
  document.getElementById("todayLabel");


/* =====================================================
   DATE
===================================================== */

function todayISO() {

  const d =
    new Date();

  const local =
    new Date(
      d.getTime()
      -
      d.getTimezoneOffset() * 60000
    );

  return local
    .toISOString()
    .slice(0, 10);
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m])
  );

}


/* =====================================================
   DUE STATE
===================================================== */

function dueState(task) {

  if (
    task.status !== "New"
  ) {

    return "";

  }


  if (
    task.due_date <
    todayISO()
  ) {

    return "overdue";

  }


  if (
    task.due_date ===
    todayISO()
  ) {

    return "due";

  }


  return "";

}


/* =====================================================
   LOGIN MESSAGE
===================================================== */

function msg(text) {

  loginMsg.textContent =
    text;

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

  app.classList.add(
    "hidden"
  );

  login.classList.remove(
    "hidden"
  );

  password.value =
    "";

}


/* =====================================================
   SHOW APP
===================================================== */

function showApp() {

  login.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );

  todayLabel.textContent =
    new Date().toLocaleDateString(
      undefined,
      {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );

}


/* =====================================================
   LOAD TASKS
===================================================== */

async function loadTasks() {

  const {
    data: {
      user
    }
  } =
    await sb.auth.getUser();


  if (!user) {

    showLogin();

    return;

  }


  /*
    IMPORTANT:
    Only load tasks belonging to
    the currently logged-in user.
  */

  const {
    data,
    error
  } =
    await sb
      .from("tasks")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .order(
        "due_date",
        {
          ascending: true
        }
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      error
    );

    alert(
      "Unable to load tasks:\n"
      +
      error.message
    );

    return;

  }


  tasks =
    data || [];

  selected.clear();

  render();

}


/* =====================================================
   FILTER
===================================================== */

function filtered() {

  let a =
    [...tasks];

  const q =
    search.value
      .trim()
      .toLowerCase();

  const ty =
    typeFilter.value;

  const re =
    relatedFilter.value;

  const st =
    statusFilter.value;


  if (
    view === "new"
  ) {

    a =
      a.filter(
        t =>
          t.status === "New"
      );

  }


  if (
    view === "due"
  ) {

    a =
      a.filter(
        t =>
          dueState(t) === "due"
      );

  }


  if (
    view === "overdue"
  ) {

    a =
      a.filter(
        t =>
          dueState(t) ===
          "overdue"
      );

  }


  if (
    view === "upcoming"
  ) {

    a =
      a.filter(
        t =>
          t.status === "New"
          &&
          t.due_date >
          todayISO()
      );

  }


  if (
    view === "completed"
  ) {

    a =
      a.filter(
        t =>
          t.status ===
          "Completed"
      );

  }


  if (
    view === "cancelled"
  ) {

    a =
      a.filter(
        t =>
          t.status ===
          "Cancelled"
      );

  }


  if (q) {

    a =
      a.filter(
        t =>
          (
            String(
              t.title || ""
            )
            +
            " "
            +
            String(
              t.details || ""
            )
          )
          .toLowerCase()
          .includes(q)
      );

  }


  if (ty) {

    a =
      a.filter(
        t =>
          t.type === ty
      );

  }


  if (re) {

    a =
      a.filter(
        t =>
          t.related === re
      );

  }


  if (st) {

    a =
      a.filter(
        t =>
          t.status === st
      );

  }


  return a;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

  document.getElementById(
    "cTotal"
  ).textContent =
    tasks.length;


  document.getElementById(
    "cNew"
  ).textContent =
    tasks.filter(
      t =>
        t.status === "New"
    ).length;


  document.getElementById(
    "cDue"
  ).textContent =
    tasks.filter(
      t =>
        dueState(t) === "due"
    ).length;


  document.getElementById(
    "cOverdue"
  ).textContent =
    tasks.filter(
      t =>
        dueState(t) ===
        "overdue"
    ).length;


  document.getElementById(
    "cCompleted"
  ).textContent =
    tasks.filter(
      t =>
        t.status ===
        "Completed"
    ).length;


  document.getElementById(
    "cCancelled"
  ).textContent =
    tasks.filter(
      t =>
        t.status ===
        "Cancelled"
    ).length;


  const a =
    filtered();


  if (!a.length) {

    tbody.innerHTML =
      `
      <tr>
        <td
          colspan="8"
          class="empty">
          No tasks found.
        </td>
      </tr>
      `;

    updateButtons();

    return;

  }


  tbody.innerHTML =
    a.map(
      t => {

        const selectedClass =
          selected.has(
            String(t.id)
          )
            ?
            "selected"
            :
            "";


        const checked =
          selected.has(
            String(t.id)
          )
            ?
            "checked"
            :
            "";


        let typeClass =
          "low";


        if (
          t.type ===
          "Important"
        ) {

          typeClass =
            "imp";

        }
        else if (
          t.type ===
          "Medium"
        ) {

          typeClass =
            "med";

        }


        let statusClass =
          "new";


        if (
          t.status ===
          "Completed"
        ) {

          statusClass =
            "completed";

        }
        else if (
          t.status ===
          "Cancelled"
        ) {

          statusClass =
            "cancelled";

        }


        let dueBadge =
          "";


        if (
          dueState(t) ===
          "overdue"
        ) {

          dueBadge =
            `
            <span class="pill overdue">
              Overdue
            </span>
            `;

        }
        else if (
          dueState(t) ===
          "due"
        ) {

          dueBadge =
            `
            <span class="pill due">
              Due
            </span>
            `;

        }


        return `
          <tr
            class="${selectedClass}"
            data-id="${esc(t.id)}">

            <td>
              <input
                class="rowCheck"
                type="checkbox"
                ${checked}>
            </td>

            <td>
              ${esc(t.task_date)}
            </td>

            <td>
              <b>
                ${esc(t.title)}
              </b>
            </td>

            <td>
              ${esc(t.details)}
            </td>

            <td>
              <span
                class="pill ${typeClass}">
                ${esc(t.type)}
              </span>
            </td>

            <td>
              ${esc(t.related)}
            </td>

            <td>
              ${esc(t.due_date)}
              ${dueBadge}
            </td>

            <td>
              <span
                class="pill ${statusClass}">
                ${esc(t.status)}
              </span>
            </td>

          </tr>
        `;

      }
    ).join("");


  document
    .querySelectorAll(
      ".rowCheck"
    )
    .forEach(
      checkbox => {

        checkbox.onchange =
          function() {

            const tr =
              this.closest(
                "tr"
              );

            const id =
              String(
                tr.dataset.id
              );


            if (
              this.checked
            ) {

              selected.add(
                id
              );

            }
            else {

              selected.delete(
                id
              );

            }


            render();

          };

      }
    );


  updateButtons();

}


/* =====================================================
   BUTTON STATE
===================================================== */

function updateButtons() {

  const n =
    selected.size;


  editBtn.disabled =
    n !== 1;


  removeBtn.disabled =
    n === 0;


  completeBtn.disabled =
    n !== 1;


  cancelBtn.disabled =
    n !== 1;


  const visible =
    filtered();


  selectAll.checked =
    visible.length > 0
    &&
    visible.every(
      t =>
        selected.has(
          String(t.id)
        )
    );

}


/* =====================================================
   OPEN CREATE MODAL
===================================================== */

function openCreateModal() {

  editingId =
    null;


  modalTitle.textContent =
    "Create New Task";


  saveBtn.textContent =
    "Create Task";


  taskForm.reset();


  date.value =
    todayISO();


  dueDate.value =
    todayISO();


  type.value =
    "Medium";


  related.value =
    "Work";


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   OPEN EDIT MODAL
===================================================== */

function openEditModal(task) {

  if (!task) {

    return;

  }


  editingId =
    task.id;


  modalTitle.textContent =
    "Edit Task";


  saveBtn.textContent =
    "Save Changes";


  date.value =
    task.task_date ||
    todayISO();


  title.value =
    task.title ||
    "";


  details.value =
    task.details ||
    "";


  type.value =
    task.type ||
    "Medium";


  related.value =
    task.related ||
    "Work";


  dueDate.value =
    task.due_date ||
    todayISO();


  modal.classList.add(
    "show"
  );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeTaskModal() {

  editingId =
    null;

  taskForm.reset();

  modal.classList.remove(
    "show"
  );

}


/* =====================================================
   CREATE BUTTON
===================================================== */

createBtn.onclick =
  function() {

    openCreateModal();

  };


/* =====================================================
   CANCEL BUTTON
===================================================== */

closeModalBtn.onclick =
  function(e) {

    e.preventDefault();

    closeTaskModal();

  };


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

modal.onclick =
  function(e) {

    if (
      e.target === modal
    ) {

      closeTaskModal();

    }

  };


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape"
      &&
      modal.classList.contains(
        "show"
      )
    ) {

      closeTaskModal();

    }

  }
);


/* =====================================================
   SAVE TASK
===================================================== */

taskForm.onsubmit =
  async function(e) {

    e.preventDefault();


    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    if (!user) {

      showLogin();

      return;

    }


    const payload = {

      task_date:
        date.value,

      title:
        title.value.trim(),

      details:
        details.value.trim(),

      type:
        type.value,

      related:
        related.value,

      due_date:
        dueDate.value

    };


    if (
      !payload.title
    ) {

      alert(
        "Please enter task title."
      );

      return;

    }


    if (
      !payload.due_date
    ) {

      alert(
        "Please select due date."
      );

      return;

    }


    saveBtn.disabled =
      true;


    saveBtn.textContent =
      "Saving...";


    let result;


    if (editingId) {

      /*
        User ID is included in the update condition
        so another user's task cannot be edited.
      */

      result =
        await sb
          .from("tasks")
          .update(payload)
          .eq(
            "id",
            editingId
          )
          .eq(
            "user_id",
            user.id
          );

    }
    else {

      result =
        await sb
          .from("tasks")
          .insert({

            ...payload,

            user_id:
              user.id,

            status:
              "New"

          });

    }


    saveBtn.disabled =
      false;


    saveBtn.textContent =
      editingId
        ?
        "Save Changes"
        :
        "Create Task";


    if (
      result.error
    ) {

      alert(
        "Unable to save task:\n"
        +
        result.error.message
      );

      return;

    }


    closeTaskModal();

    selected.clear();

    await loadTasks();

  };


/* =====================================================
   EDIT BUTTON
===================================================== */

editBtn.onclick =
  function() {

    if (
      selected.size !== 1
    ) {

      return;

    }


    const id =
      [...selected][0];


    const task =
      tasks.find(
        t =>
          String(t.id) ===
          String(id)
      );


    openEditModal(
      task
    );

  };


/* =====================================================
   REMOVE SELECTED
===================================================== */

removeBtn.onclick =
  async function() {

    if (
      selected.size === 0
    ) {

      return;

    }


    const ok =
      confirm(
        `Remove ${selected.size} selected task(s)?`
      );


    if (!ok) {

      return;

    }


    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    if (!user) {

      showLogin();

      return;

    }


    const ids =
      [...selected];


    const {
      error
    } =
      await sb
        .from("tasks")
        .delete()
        .in(
          "id",
          ids
        )
        .eq(
          "user_id",
          user.id
        );


    if (error) {

      alert(
        "Remove failed:\n"
        +
        error.message
      );

      return;

    }


    selected.clear();

    await loadTasks();

  };


/* =====================================================
   COMPLETE
===================================================== */

completeBtn.onclick =
  async function() {

    if (
      selected.size !== 1
    ) {

      return;

    }


    const id =
      [...selected][0];


    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    if (!user) {

      showLogin();

      return;

    }


    const {
      error
    } =
      await sb
        .from("tasks")
        .update({

          status:
            "Completed",

          completed_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          user.id
        );


    if (error) {

      alert(
        "Unable to complete task:\n"
        +
        error.message
      );

      return;

    }


    selected.clear();

    await loadTasks();

  };


/* =====================================================
   CANCEL TASK
===================================================== */

cancelBtn.onclick =
  async function() {

    if (
      selected.size !== 1
    ) {

      return;

    }


    const id =
      [...selected][0];


    const ok =
      confirm(
        "Cancel the selected task?"
      );


    if (!ok) {

      return;

    }


    const {
      data: {
        user
      }
    } =
      await sb.auth.getUser();


    if (!user) {

      showLogin();

      return;

    }


    const {
      error
    } =
      await sb
        .from("tasks")
        .update({

          status:
            "Cancelled",

          cancelled_at:
            new Date()
              .toISOString()

        })
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          user.id
        );


    if (error) {

      alert(
        "Unable to cancel task:\n"
        +
        error.message
      );

      return;

    }


    selected.clear();

    await loadTasks();

  };


/* =====================================================
   SELECT ALL
===================================================== */

selectAll.onchange =
  function() {

    const visible =
      filtered();


    visible.forEach(
      task => {

        const id =
          String(
            task.id
          );


        if (
          selectAll.checked
        ) {

          selected.add(
            id
          );

        }
        else {

          selected.delete(
            id
          );

        }

      }
    );


    render();

  };


/* =====================================================
   SEARCH / FILTER
===================================================== */

[
  search,
  typeFilter,
  relatedFilter,
  statusFilter
]
.forEach(
  element => {

    element.oninput =
      function() {

        selected.clear();

        render();

      };

  }
);


/* =====================================================
   NAVIGATION
===================================================== */

document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(
    button => {

      button.onclick =
        function() {

          const newView =
            this.dataset.view;


          /*
            New button opens Create modal.
          */

          if (
            newView === "new"
          ) {

            openCreateModal();

            return;

          }


          document
            .querySelectorAll(
              ".nav button"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );


          this.classList.add(
            "active"
          );


          view =
            newView;


          selected.clear();


          const titles = {

            dashboard:
              "Akash Dashboard",

            all:
              "All Tasks",

            due:
              "Due Today",

            overdue:
              "Overdue",

            upcoming:
              "Upcoming",

            completed:
              "Completed",

            cancelled:
              "Cancelled"

          };


          pageTitle.textContent =
            titles[view]
            ||
            "Akash Dashboard";


          render();

        };

    }
  );


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.onclick =
  async function() {

    const {
      error
    } =
      await sb.auth.signOut();


    if (error) {

      alert(
        "Logout failed:\n"
        +
        error.message
      );

      return;

    }


    tasks = [];

    selected.clear();

    showLogin();

    msg("");

  };


/* =====================================================
   LOGIN
===================================================== */

loginBtn.onclick =
  async function() {

    const userEmail =
      email.value.trim();

    const userPassword =
      password.value;


    if (!userEmail) {

      msg(
        "Please enter your email."
      );

      return;

    }


    if (!userPassword) {

      msg(
        "Please enter your password."
      );

      return;

    }


    loginBtn.disabled =
      true;


    msg(
      "Signing in..."
    );


    const {
      data,
      error
    } =
      await sb.auth
        .signInWithPassword({

          email:
            userEmail,

          password:
            userPassword

        });


    loginBtn.disabled =
      false;


    if (error) {

      msg(
        "Login failed: "
        +
        error.message
      );

      return;

    }


    if (!data.session) {

      msg(
        "Login failed. No session created."
      );

      return;

    }


    msg("");

    showApp();

    await loadTasks();

  };


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

password.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter"
    ) {

      loginBtn.click();

    }

  }
);


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

sb.auth.onAuthStateChange(
  async function(
    event,
    session
  ) {

    if (session) {

      showApp();

      await loadTasks();

    }
    else {

      tasks = [];

      selected.clear();

      showLogin();

    }

  }
);


/* =====================================================
   INITIAL AUTH CHECK
===================================================== */

async function initializeApp() {

  /*
    This is the important fix.

    Every time the URL is opened, first check whether
    a valid Supabase session exists.

    No session = login screen.
    Valid session = dashboard.
  */

  const {
    data,
    error
  } =
    await sb.auth.getSession();


  if (error) {

    console.error(
      error
    );

    showLogin();

    return;

  }


  if (
    data &&
    data.session
  ) {

    showApp();

    await loadTasks();

  }
  else {

    showLogin();

  }

}


/* =====================================================
   START APPLICATION
===================================================== */

initializeApp();

</script>

</html>
